spring.application.name=booking

# Database credentials come from environment variables (see .env.example at the repo root).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking}
spring.datasource.username=${DB_USER:booking}
spring.datasource.password=${DB_PASSWORD:change-me}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
